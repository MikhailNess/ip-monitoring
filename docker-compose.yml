version: "3.9"

services:
  db:
    image: postgres:15
    container_name: monitoring-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy from .env.example)}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitoring} -d ${POSTGRES_DB:-monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: monitoring-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monitoring}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monitoring}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-monitoring}
      DB_NAME: ${POSTGRES_DB:-monitoring}
      RACK_ENV: production
      LOG_NAMESPACE: ip_monitoring
      ROLE: app
    ports:
      - "4567:4567"
    command: ["bundle", "exec", "puma", "-b", "tcp://0.0.0.0:4567", "config.ru"]

  spec:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monitoring}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monitoring}
      RACK_ENV: test
    command: ["bundle", "exec", "rspec"]

  worker:
    build: .
    container_name: monitoring-worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monitoring}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-monitoring}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-monitoring}
      DB_NAME: ${POSTGRES_DB:-monitoring}
      RACK_ENV: production
      LOG_NAMESPACE: ip_monitoring
      ROLE: worker
      CHECK_INTERVAL_SECONDS: "60" # 60 seconds in task
    command: ["bundle", "exec", "ruby", "workers/ping_worker.rb"]
    restart: unless-stopped

