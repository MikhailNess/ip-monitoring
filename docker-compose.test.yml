services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: monitoring_test
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      RACK_ENV: test
      DATABASE_URL: postgres://monitoring:monitoring_test@db-test:5432/monitoring_test
    entrypoint: ["bundle", "exec"]
    command: ["rspec"]
