<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мониторинг IP — демо</title>
  <link rel="stylesheet" href="/demo.css" />
</head>
<body>
  <h1>Мониторинг IP — демо API</h1>
  <p class="hint">
    Запросы через <code>fetch</code>; ответ JSON пишется в блок ниже (как у API, не редирект страницы).
  </p>

  <fieldset>
    <legend>Создать IP</legend>
    <form id="formCreate">
      <label for="f-ip">Адрес (IPv4 / IPv6)</label>
      <input id="f-ip" name="ip" type="text" value="127.0.0.1" required autocomplete="off" />
      <input type="hidden" name="enabled" value="false" />
      <div class="row">
        <label><input type="checkbox" id="f-enabled-cb" /> Включить мониторинг сразу</label>
      </div>
      <div class="row">
        <button type="submit">POST /ips</button>
      </div>
    </form>
  </fieldset>

  <fieldset>
    <legend>Операции по id</legend>
    <label for="ipId">id записи</label>
    <input id="ipId" type="number" min="1" step="1" placeholder="после создания подставится автоматически" />
    <div class="row">
      <button type="button" id="btnEnable">POST …/enable</button>
      <button type="button" id="btnDisable">POST …/disable</button>
      <button type="button" id="btnDelete" class="danger">DELETE …</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Статистика</legend>
    <label for="timeFrom">time_from (локальное время → уходит как ISO8601 UTC)</label>
    <input id="timeFrom" type="datetime-local" />
    <label for="timeTo">time_to</label>
    <input id="timeTo" type="datetime-local" />
    <div class="row">
      <button type="button" id="btnStats">GET …/stats</button>
    </div>
  </fieldset>

  <pre id="log" aria-live="polite"></pre>
  <script src="/demo.js" defer></script>
</body>
</html>
