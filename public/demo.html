<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IP monitoring — demo</title>
  <link rel="stylesheet" href="/demo.css" />
</head>
<body>
  <h1>IP monitoring — API demo</h1>
  <p class="hint">
    Requests use <code>fetch</code>; the JSON response is printed below (API-style, no full-page redirect).
  </p>

  <fieldset>
    <legend>Create IP</legend>
    <form id="formCreate">
      <label for="f-ip">Address (IPv4 / IPv6)</label>
      <input id="f-ip" name="ip" type="text" value="127.0.0.1" required autocomplete="off" />
      <input type="hidden" name="enabled" value="false" />
      <div class="row">
        <label><input type="checkbox" id="f-enabled-cb" /> Enable monitoring immediately</label>
      </div>
      <div class="row">
        <button type="submit">POST /ips</button>
      </div>
    </form>
  </fieldset>

  <fieldset>
    <legend>Operations by id</legend>
    <label for="ipId">Record id</label>
    <input id="ipId" type="number" min="1" step="1" placeholder="filled automatically after create" />
    <div class="row">
      <button type="button" id="btnEnable">POST …/enable</button>
      <button type="button" id="btnDisable">POST …/disable</button>
      <button type="button" id="btnDelete" class="danger">DELETE …</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Statistics</legend>
    <label for="timeFrom">time_from (local time, sent as ISO8601 UTC)</label>
    <input id="timeFrom" type="datetime-local" />
    <label for="timeTo">time_to</label>
    <input id="timeTo" type="datetime-local" />
    <div class="row">
      <button type="button" id="btnStats">GET …/stats</button>
    </div>
  </fieldset>

  <pre id="log" aria-live="polite"></pre>
  <script src="/demo.js" defer></script>
</body>
</html>
